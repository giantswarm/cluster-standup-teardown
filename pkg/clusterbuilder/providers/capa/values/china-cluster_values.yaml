global:
  metadata:
    name: "{{ .ClusterName }}"
    description: "E2E Test cluster"
    organization: "{{ .Organization }}"

  components:
    containerd:
      containerRegistries:
        gsoci.azurecr.io:
          - endpoint: giantswarm-registry.cn-shanghai.cr.aliyuncs.com
          - endpoint: gsoci.azurecr.io

  controlPlane:
    instanceType: c5.xlarge

  nodePools:
    nodepool-0:
      instanceType: t3a.xlarge
      minSize: 2
      maxSize: 5
      # Speed up the ASG cycle when upgrading to avoid having long running test case
      instanceWarmup: 180

  apps:
    externalDns:
      values:
        triggerLoopOnEvent: true
    clusterAutoscaler:
      values:
        configmap:
          # Prevent cluster-autoscaler from trying to scale down while we're in the middle of our scaling test
          scaleDownUnneededTime: 15m0s
